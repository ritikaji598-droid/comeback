<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Comeback">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Comeback</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;color:#f5f5f4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a0a0a}
  #splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0a0a0a;transition:opacity .4s ease}
  #splash.gone{opacity:0;pointer-events:none}
  .logo{width:88px;height:88px;border-radius:24px;background:#d4ff00;display:grid;place-items:center;animation:b 1.3s ease-in-out infinite}
  .logo svg{width:48px;height:48px}
  @keyframes b{50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(212,255,0,.12)}}
  #splash b{font:800 34px/1 "Arial Narrow",system-ui,sans-serif;letter-spacing:.04em;margin-top:10px}
  #splash small{font-size:12px;color:#a3a3a3;letter-spacing:.2em;text-transform:uppercase}
  #help{display:none;max-width:300px;text-align:center;font-size:14px;color:#d4d4d4;line-height:1.5;margin-top:18px}
  #help a{display:inline-block;margin-top:10px;background:#d4ff00;color:#0a0a0a;font-weight:800;text-decoration:none;padding:12px 18px;border-radius:10px}
</style>
</head>
<body>
<iframe id="app" title="Comeback Coach"
  src="https://script.google.com/macros/s/AKfycbz0ry_gBq9-Hd9r2l1HdaMZcLaYJY6ntzGL0n7xwNHXXrb3KbaW7o_bBu92tAmEH1-tsg/exec"
  allow="clipboard-read; clipboard-write; camera; microphone; fullscreen"></iframe>
<div id="splash">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#0a0a0a"/></svg></div>
  <b>COMEBACK</b>
  <small>Loading your comeback…</small>
  <div id="help">
    App load nahi ho raha? Shayad Google me login chahiye.<br>
    <a href="https://script.google.com/macros/s/AKfycbz0ry_gBq9-Hd9r2l1HdaMZcLaYJY6ntzGL0n7xwNHXXrb3KbaW7o_bBu92tAmEH1-tsg/exec" target="_blank" rel="noopener">Yahan tap karke login karo</a><br>
    <span style="font-size:12px;color:#8a8a8a">Login ke baad ye app band karke dobara kholo.</span>
  </div>
</div>
<script>
  var f=document.getElementById('app'), s=document.getElementById('splash');
  f.addEventListener('load',function(){ setTimeout(function(){ s.classList.add('gone'); },600); });
  setTimeout(function(){ if(!s.classList.contains('gone')) document.getElementById('help').style.display='block'; },12000);
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
